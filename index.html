<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - Rick and Morty App</title>

  <!-- Carga de Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Configurar Tailwind para modo oscuro -->
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <!-- Aplicar el tema guardado en localStorage antes del render -->
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>

  <!-- Íconos FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Protección de ruta anticipada -->
  <script>
    const usuarioLogueado = localStorage.getItem('usuarioLogueado');
    if (!usuarioLogueado) {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-300">

  <!-- Barra de Navegación -->
  <header class="bg-white dark:bg-gray-800 shadow-md px-6 py-4 flex justify-between items-center transition-colors duration-300">
    <!-- Saludo dinámico con el nombre del usuario -->
    <h1 id="userGreeting" class="text-xl font-bold text-gray-800 dark:text-white">Hola, Cargando...</h1>

    <div class="flex items-center space-x-4">
      <!-- Botón de Modo Oscuro / Claro -->
      <button id="themeToggle" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 p-2 rounded-lg transition cursor-pointer" title="Cambiar tema">
        <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
      </button>

      <!-- Enlaces a Favoritos y Cuenta -->
      <a href="favorites.html" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium flex items-center gap-1">
        <i class="fa-solid fa-heart text-red-500"></i> Favoritos
      </a>
      <a href="account.html" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium flex items-center gap-1">
        <i class="fa-solid fa-user"></i> Mi Cuenta
      </a>

      <!-- Botón para cerrar sesión -->
      <button id="btnLogout" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-semibold transition cursor-pointer flex items-center gap-1 shadow-sm">
        <i class="fa-solid fa-right-from-bracket"></i> Salir
      </button>
    </div>
  </header>

  <!-- Contenido Principal: Catálogo de Personajes -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <h2 class="text-3xl font-black text-gray-800 dark:text-white text-center mb-8">Catálogo de Personajes</h2>
    
    <!-- Contenedor del Catálogo para renderizado dinámico -->
    <div id="characterContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Las tarjetas se generan dinámicamente desde app.js -->
    </div>
  </main>

  <!-- Script Principal Módulo ES6 para obtener los personajes de la API -->
  <script type="module" src="app.js"></script>

  <!-- Script para alternar el Modo Oscuro / Claro -->
  <script>
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    // Sincronizar el icono inicial
    if (document.documentElement.classList.contains('dark')) {
      themeIcon.className = 'fa-solid fa-sun text-lg text-yellow-400';
    } else {
      themeIcon.className = 'fa-solid fa-moon text-lg text-gray-700';
    }

    // Escuchar clic para guardar preferencia y cambiar clases
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      themeIcon.className = isDark ? 'fa-solid fa-sun text-lg text-yellow-400' : 'fa-solid fa-moon text-lg text-gray-700';
    });
  </script>
</body>
</html>
