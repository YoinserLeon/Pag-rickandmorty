<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Rick and Morty App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col justify-between transition-colors duration-300">

  <div class="flex justify-end p-6">
    <button id="themeToggle" class="bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-700 p-3 rounded-full shadow-md transition cursor-pointer flex items-center justify-center w-12 h-12" title="Cambiar tema">
      <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
    </button>
  </div>

  <main class="max-w-md mx-auto px-4 py-6 w-full flex-grow flex items-center">
    <div class="bg-white dark:bg-gray-800 border border-transparent dark:border-gray-700 rounded-2xl shadow-xl overflow-hidden p-8 w-full transition-colors duration-300">
      
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 rounded-full text-3xl mb-4 shadow-inner">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h2 class="text-2xl font-black text-gray-800 dark:text-white">Crear Cuenta</h2>
        <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Regístrate para explorar el universo de Rick and Morty</p>
      </div>

      <div id="errorMessage" class="hidden mb-5 p-3 rounded-lg bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300 text-sm font-semibold text-center border border-red-200 dark:border-red-800"></div>
      <div id="successMessage" class="hidden mb-5 p-3 rounded-lg bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-300 text-sm font-semibold text-center border border-green-200 dark:border-green-800"></div>

      <form id="registerForm" class="space-y-4">
        <div>
          <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">Nombre</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-solid fa-user"></i>
            </span>
            <input type="text" id="nombre" required placeholder="Tu nombre" class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-800 dark:text-gray-100">
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">Apellido</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-solid fa-user-tag"></i>
            </span>
            <input type="text" id="apellido" required placeholder="Tu apellido" class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-800 dark:text-gray-100">
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">Correo Electrónico</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <input type="email" id="email" required placeholder="tucorreo@email.com" class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-800 dark:text-gray-100">
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="password" required placeholder="••••••••" class="w-full pl-10 pr-10 py-2.5 bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-800 dark:text-gray-100">
            <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 cursor-pointer">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">Confirmar Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-solid fa-shield-halved"></i>
            </span>
            <input type="password" id="confirmPassword" required placeholder="••••••••" class="w-full pl-10 pr-10 py-2.5 bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-800 dark:text-gray-100">
            <button type="button" id="toggleConfirmPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 cursor-pointer">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md cursor-pointer flex items-center justify-center gap-2 mt-2">
          <i class="fa-solid fa-user-check"></i> Registrarse
        </button>
      </form>

      <p class="text-center text-sm text-gray-600 dark:text-gray-400 mt-6">
        ¿Ya tienes una cuenta? <a href="login.html" class="text-blue-600 dark:text-blue-400 font-bold hover:underline">Inicia sesión</a>
      </p>

    </div>
  </main>

  <footer class="text-center py-6 text-gray-500 dark:text-gray-400 text-sm">
    Rick and Morty App &copy; 2026
  </footer>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    if (document.documentElement.classList.contains('dark')) {
      themeIcon.className = 'fa-solid fa-sun text-lg text-yellow-400';
    } else {
      themeIcon.className = 'fa-solid fa-moon text-lg text-gray-700';
    }

    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      themeIcon.className = isDark ? 'fa-solid fa-sun text-lg text-yellow-400' : 'fa-solid fa-moon text-lg text-gray-700';
    });
  </script>

  <script type="module" src="../js/register.js"></script>
</body>
</html>
