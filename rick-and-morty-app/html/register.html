<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Rick and Morty App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">Crear Cuenta</h1>
    
    <form id="registerForm" class="flex flex-col gap-4" novalidate>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
        <input type="text" id="nombre" class="w-full border-2 border-gray-300 rounded-md px-4 py-2 outline-none transition-colors">
        <p id="errorNombre" class="text-red-600 text-xs mt-1 hidden font-semibold"></p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Apellido</label>
        <input type="text" id="apellido" class="w-full border-2 border-gray-300 rounded-md px-4 py-2 outline-none transition-colors">
        <p id="errorApellido" class="text-red-600 text-xs mt-1 hidden font-semibold"></p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
        <input type="email" id="correo" class="w-full border-2 border-gray-300 rounded-md px-4 py-2 outline-none transition-colors">
        <p id="errorCorreo" class="text-red-600 text-xs mt-1 hidden font-semibold"></p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <div class="relative">
          <input type="password" id="password" class="w-full border-2 border-gray-300 rounded-md px-4 py-2 pr-10 outline-none transition-colors">
          <button type="button" id="togglePassword" class="absolute right-3 top-2.5 text-gray-600 cursor-pointer">
            <i class="fa-solid fa-eye-slash text-lg"></i>
          </button>
        </div>
        <p id="errorPassword" class="text-red-600 text-xs mt-1 hidden font-semibold"></p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar Contraseña</label>
        <div class="relative">
          <input type="password" id="confirmPassword" class="w-full border-2 border-gray-300 rounded-md px-4 py-2 pr-10 outline-none transition-colors">
          <button type="button" id="toggleConfirm" class="absolute right-3 top-2.5 text-gray-600 cursor-pointer">
            <i class="fa-solid fa-eye-slash text-lg"></i>
          </button>
        </div>
        <p id="errorConfirm" class="text-red-600 text-xs mt-1 hidden font-semibold"></p>
      </div>

      <button type="submit" class="bg-blue-600 text-white font-semibold py-2 mt-4 rounded-md hover:bg-blue-700 transition">Registrarse</button>
      <p class="text-sm text-center mt-4">¿Ya tienes cuenta? <a href="login.html" class="text-blue-600 hover:underline">Inicia sesión</a></p>
    </form>
  </div>

<script src="../js/auth.js"></script>
</body>
</html>
