<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Rick and Morty App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">Iniciar Sesión</h1>
    
    <form id="loginForm" class="flex flex-col gap-4" novalidate>
      
      <div id="loginAlert" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative hidden">
        <span class="block sm:inline font-semibold">Correo o contraseña incorrectos.</span>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
        <input type="email" id="loginCorreo" autocomplete="off" class="w-full border-2 border-gray-300 rounded-md px-4 py-2 outline-none transition-colors focus:border-blue-500">
        <p id="errorLoginCorreo" class="text-red-600 text-xs mt-1 hidden font-semibold"></p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <div class="relative">
          <input type="password" id="loginPassword" autocomplete="new-password" class="w-full border-2 border-gray-300 rounded-md px-4 py-2 pr-10 outline-none transition-colors focus:border-blue-500">
          <button type="button" id="toggleLoginPassword" class="absolute right-3 top-2.5 text-gray-600 cursor-pointer">
            <i class="fa-solid fa-eye-slash text-lg"></i>
          </button>
        </div>
        <p id="errorLoginPassword" class="text-red-600 text-xs mt-1 hidden font-semibold"></p>
      </div>

      <button type="submit" class="bg-blue-600 text-white font-semibold py-2 mt-4 rounded-md hover:bg-blue-700 transition">Ingresar</button>
      <p class="text-sm text-center mt-4">¿No tienes cuenta? <a href="register.html" class="text-blue-600 hover:underline">Regístrate</a></p>
    </form>
  </div>

  <script src="../js/validations.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
