<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favoritos - Rick and Morty App</title>

  <!-- Carga de Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <!-- Aplicar tema guardado en localStorage -->
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>

  <!-- Iconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Protección de ruta -->
  <script>
    const usuarioLogueado = localStorage.getItem('usuarioLogueado');
    if (!usuarioLogueado) {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col justify-between transition-colors duration-300">

  <!-- Barra de Navegación -->
  <header class="bg-white dark:bg-gray-800 shadow-md px-6 py-4 flex justify-between items-center transition-colors duration-300">
    <h1 class="text-xl font-bold text-gray-800 dark:text-white">Rick and Morty API</h1>
    <div class="flex items-center space-x-4">
      <!-- Botón de Modo Oscuro / Claro -->
      <button id="themeToggle" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 p-2 rounded-lg transition cursor-pointer" title="Cambiar tema">
        <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
      </button>

      <!-- Enlaces de navegación -->
      <a href="index.html" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium flex items-center gap-1">
        <i class="fa-solid fa-house"></i> Volver al inicio
      </a>
      <a href="account.html" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium flex items-center gap-1">
        <i class="fa-solid fa-user"></i> Mi Cuenta
      </a>

      <!-- Botón de cierre de sesión -->
      <button id="btnLogout" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-semibold transition cursor-pointer flex items-center gap-1 shadow-sm">
        <i class="fa-solid fa-right-from-bracket"></i> Salir
      </button>
    </div>
  </header>

  <!-- Contenido Principal: Rejilla de Personajes Favoritos -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow">
    <h2 class="text-3xl font-black text-gray-800 dark:text-white text-center mb-2">Tus Personajes Favoritos</h2>
    <p class="text-center text-gray-600 dark:text-gray-400 mb-8">Aquí encontrarás todos los personajes que has guardado en tu lista.</p>
    
    <!-- Contenedor dinámico donde se agregan las tarjetas -->
    <div id="favoritesContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </main>

  <!-- Pie de página -->
  <footer class="text-center py-6 text-gray-500 dark:text-gray-400 text-sm">
    Rick and Morty App &copy; 2026
  </footer>

  <!-- Script para conmutar el Tema -->
  <script>
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    if (document.documentElement.classList.contains('dark')) {
      themeIcon.className = 'fa-solid fa-sun text-lg text-yellow-400';
    } else {
      themeIcon.className = 'fa-solid fa-moon text-lg text-gray-700';
    }
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      themeIcon.className = isDark ? 'fa-solid fa-sun text-lg text-yellow-400' : 'fa-solid fa-moon text-lg text-gray-700';
    });
  </script>

  <!-- Script Módulo: Renderiza favoritos guardados y gestiona interacciones -->
  <script type="module">
    import { obtenerFavoritos, toggleFavorito } from '../js/favorites.js';
    import { cerrarSesion } from '../js/auth.js';

    document.addEventListener('DOMContentLoaded', () => {
      // Manejar el cierre de sesión
      const btnLogout = document.getElementById('btnLogout');
      if (btnLogout) {
        btnLogout.addEventListener('click', (e) => {
          e.preventDefault();
          cerrarSesion();
        });
      }

      const contenedor = document.getElementById('favoritesContainer');
      if (!contenedor) return;

      // Función para dibujar las tarjetas de los personajes favoritos
      function renderizarFavoritos() {
        const favoritos = obtenerFavoritos();

        // Mostrar estado vacío si no hay favoritos
        if (favoritos.length === 0) {
          contenedor.innerHTML = `
            <div class="col-span-full text-center py-12">
              <i class="fa-solid fa-heart-crack text-5xl text-gray-300 dark:text-gray-600 mb-3"></i>
              <p class="text-gray-500 dark:text-gray-400 font-bold text-lg">No tienes personajes favoritos guardados.</p>
              <a href="index.html" class="inline-block mt-4 bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700 transition shadow-md">Volver al Catálogo</a>
            </div>`;
          return;
        }

        // Limpiar el contenedor y generar cada tarjeta
        contenedor.innerHTML = '';
        favoritos.forEach(personaje => {
          // Asignar color según el estado del personaje
          let colorEstado = 'bg-gray-500';
          if (personaje.status === 'Alive') colorEstado = 'bg-green-500';
          else if (personaje.status === 'Dead') colorEstado = 'bg-red-500';

          const card = document.createElement('div');
          card.className = 'bg-white dark:bg-gray-800 border border-transparent dark:border-gray-700 rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-all duration-300 flex flex-col cursor-pointer transform hover:-translate-y-1 relative';
          
          card.innerHTML = `
            <div class="relative">
              <img src="${personaje.image}" alt="${personaje.name}" class="w-full h-56 object-cover">
              <button class="btn-favorito absolute top-3 right-3 bg-white/90 dark:bg-gray-900/90 hover:bg-white dark:hover:bg-gray-900 p-2.5 rounded-full shadow-md transition transform hover:scale-110 flex items-center justify-center cursor-pointer" title="Quitar de favoritos">
                <i class="fa-solid fa-heart text-xl text-red-500"></i>
              </button>
            </div>
            <div class="p-4 flex flex-col flex-grow justify-between">
              <div>
                <h3 class="font-black text-lg text-gray-800 dark:text-white truncate mb-1">${personaje.name}</h3>
                <div class="flex items-center gap-2 mb-3">
                  <span class="w-3 h-3 rounded-full ${colorEstado}"></span>
                  <span class="text-sm font-semibold text-gray-600 dark:text-gray-300">${personaje.status} - ${personaje.species}</span>
                </div>
              </div>
            </div>
          `;

          // Botón para eliminar de favoritos sin activar el clic de la tarjeta
          const btnFav = card.querySelector('.btn-favorito');
          btnFav.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFavorito(personaje);
            renderizarFavoritos();
          });

          // Clic en la tarjeta para ir al detalle del personaje
          card.addEventListener('click', () => {
            window.location.href = `character.html?id=${personaje.id}`;
          });

          contenedor.appendChild(card);
        });
      }

      renderizarFavoritos();
    });
  </script>
</body>
</html>
