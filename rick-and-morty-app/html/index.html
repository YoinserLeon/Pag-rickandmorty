<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - Rick and Morty App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Barra de navegación -->
  <nav class="bg-gray-900 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold text-green-400">Rick and Morty API</h1>
    <div class="flex items-center gap-4">
      <span id="userGreeting" class="text-sm font-medium hidden sm:block"></span>
      <button id="btnLogout" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md text-sm font-semibold transition-colors">
        Cerrar Sesión
      </button>
    </div>
  </nav>

  <!-- Contenedor Principal -->
  <main class="max-w-6xl mx-auto p-6 mt-6">
    <h2 class="text-3xl font-bold text-gray-800 mb-2">Directorio de Personajes</h2>
    <p class="text-gray-600 mb-8">Explora el multiverso, revisa tu personaje favorito.</p>
    
    <!-- Las tarjetas de los personajes -->
    <div id="characterContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    </div>
  </main>

  <!-- Script independiente para la lógica de la app -->
  <script src="../js/app.js"></script>
</body>
</html>
