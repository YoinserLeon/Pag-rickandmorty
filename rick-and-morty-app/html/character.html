<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Personaje - Rick and Morty App</title>

  <!-- Carga de Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Configuración de Tailwind para modo oscuro -->
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <!-- Aplicar modo oscuro previo si está configurado -->
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>

  <!-- Carga de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Protección de ruta: Verifica si el usuario inició sesión -->
  <script>
    const usuarioLogueado = localStorage.getItem('usuarioLogueado');
    if (!usuarioLogueado) {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col justify-between transition-colors duration-300">

  <!-- Barra de Navegación -->
  <header class="bg-white dark:bg-gray-800 shadow-md px-6 py-4 flex justify-between items-center transition-colors duration-300">
    <h1 class="text-xl font-bold text-gray-800 dark:text-white">Rick and Morty API</h1>
    <div class="flex items-center space-x-4">
      <!-- Botón de Modo Oscuro / Claro -->
      <button id="themeToggle" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 p-2 rounded-lg transition cursor-pointer" title="Cambiar tema">
        <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
      </button>

      <!-- Enlaces de navegación -->
      <a href="index.html" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium flex items-center gap-1">
        <i class="fa-solid fa-house"></i> Volver al inicio
      </a>
      <a href="favorites.html" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium flex items-center gap-1">
        <i class="fa-solid fa-heart text-red-500"></i> Favoritos
      </a>
      <a href="account.html" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium flex items-center gap-1">
        <i class="fa-solid fa-user"></i> Mi Cuenta
      </a>

      <!-- Botón para cerrar sesión -->
      <button id="btnLogout" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-semibold transition cursor-pointer flex items-center gap-1 shadow-sm">
        <i class="fa-solid fa-right-from-bracket"></i> Salir
      </button>
    </div>
  </header>

  <!-- Contenido Principal: Contenedor para la tarjeta de detalles -->
  <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full">
    <div id="characterDetailContainer" class="bg-white dark:bg-gray-800 border border-transparent dark:border-gray-700 rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
      <!-- Mensaje de carga con spinner mientras se obtienen los datos -->
      <div class="w-full text-center py-20 text-gray-500 dark:text-gray-400 font-bold text-lg">
        <i class="fa-solid fa-spinner fa-spin mr-2"></i> Cargando información del personaje...
      </div>
    </div>
  </main>

  <!-- Pie de página -->
  <footer class="text-center py-6 text-gray-500 dark:text-gray-400 text-sm">
    Rick and Morty App &copy; 2026
  </footer>

  <!-- Script para conmutar el Modo Oscuro / Claro -->
  <script>
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    if (document.documentElement.classList.contains('dark')) {
      themeIcon.className = 'fa-solid fa-sun text-lg text-yellow-400';
    } else {
      themeIcon.className = 'fa-solid fa-moon text-lg text-gray-700';
    }
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      themeIcon.className = isDark ? 'fa-solid fa-sun text-lg text-yellow-400' : 'fa-solid fa-moon text-lg text-gray-700';
    });
  </script>

  <!-- Script Módulo: Carga la información detallada del personaje desde la API -->
  <script type="module" src="../js/character.js"></script>
</body>
</html>
