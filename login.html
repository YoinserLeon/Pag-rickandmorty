<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Rick and Morty App</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <!-- Aplicar tema guardado previamente -->
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col justify-between transition-colors duration-300">

  <!-- Botón flotante para alternar tema (Oscuro/Claro) -->
  <div class="flex justify-end p-6">
    <button id="themeToggle" class="bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-700 p-3 rounded-full shadow-md transition cursor-pointer flex items-center justify-center w-12 h-12" title="Cambiar tema">
      <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
    </button>
  </div>

  <!-- Contenido Principal: Tarjeta de Login -->
  <main class="max-w-md mx-auto px-4 py-6 w-full flex-grow flex items-center">
    <div class="bg-white dark:bg-gray-800 border border-transparent dark:border-gray-700 rounded-2xl shadow-xl overflow-hidden p-8 w-full transition-colors duration-300">
      
      <!-- Encabezado del Formulario -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 rounded-full text-3xl mb-4 shadow-inner">
          <i class="fa-solid fa-portal-enter"></i>
        </div>
        <h2 class="text-2xl font-black text-gray-800 dark:text-white">Iniciar Sesión</h2>
        <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Ingresa a tu cuenta de Rick and Morty</p>
      </div>

      <!-- Alerta dinámica de error si las credenciales son incorrectas -->
      <div id="loginAlert" class="hidden mb-6 p-4 rounded-lg text-sm font-semibold text-center bg-red-100 text-red-700 border border-red-200"></div>

      <!-- Formulario de ingreso -->
      <form id="loginForm" class="space-y-5">
        <!-- Campo: Correo Electrónico -->
        <div>
          <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Correo Electrónico</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-solid fa-envelope"></i>
            </span>
            <input type="email" id="email" required placeholder="tucorreo@email.com" class="w-full pl-10 pr-4 py-3 bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-800 dark:text-gray-100">
          </div>
        </div>

        <!-- Campo: Contraseña -->
        <div>
          <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-800 dark:text-gray-100">
          </div>
        </div>

        <!-- Botón de Entrar -->
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md cursor-pointer flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i> Entrar
        </button>
      </form>

      <!-- Enlace hacia la página de Registro -->
      <p class="text-center text-sm text-gray-600 dark:text-gray-400 mt-6">
        ¿No tienes una cuenta? <a href="register.html" class="text-blue-600 dark:text-blue-400 font-bold hover:underline">Regístrate aquí</a>
      </p>

    </div>
  </main>

  <!-- Pie de página -->
  <footer class="text-center py-6 text-gray-500 dark:text-gray-400 text-sm">
    Rick and Morty App &copy; 2026
  </footer>

  <!-- Script para el botón de cambio de tema -->
  <script>
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    if (document.documentElement.classList.contains('dark')) {
      themeIcon.className = 'fa-solid fa-sun text-lg text-yellow-400';
    } else {
      themeIcon.className = 'fa-solid fa-moon text-lg text-gray-700';
    }

    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      themeIcon.className = isDark ? 'fa-solid fa-sun text-lg text-yellow-400' : 'fa-solid fa-moon text-lg text-gray-700';
    });
  </script>

  <!-- Script Módulo: Procesa y valida el inicio de sesión -->
  <script type="module" src="../js/login.js"></script>
</body>
</html>
